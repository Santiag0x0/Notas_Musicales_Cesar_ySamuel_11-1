<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>¡Gracias por Jugar!</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; font-family: 'Orbitron', sans-serif; overflow: hidden; color: white; }
    body { background: linear-gradient(to right, #0f0c29, #302b63, #24243e); }

    .background-waves {
      position: fixed;
      width: 100%;
      height: 100%;
      background: repeating-linear-gradient(
        to bottom,
        rgba(0, 255, 128, 0.2) 0px,
        rgba(0, 255, 128, 0.2) 2px,
        transparent 2px,
        transparent 6px
      );
      animation: moveWaves 2s linear infinite;
      z-index: -1;
    }

    @keyframes moveWaves {
      from { background-position: 0 0; }
      to { background-position: 0 20px; }
    }

    .container {
      max-width: 700px;
      margin: 80px auto;
      padding: 40px 30px;
      background: rgba(0, 0, 0, 0.6);
      border-radius: 12px;
      text-align: center;
    }

    h1 {
      color: #00fff0;
      margin-bottom: 20px;
    }

    p {
      font-size: 1.3rem;
      margin-bottom: 40px;
    }

    .btn {
      padding: 12px 30px;
      font-size: 1.2rem;
      border: none;
      background: linear-gradient(45deg, #00fff0, #ff00ff);
      color: black;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      box-shadow: 0 0 12px #00fff0, 0 0 20px #ff00ff;
    }

    .btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 20px #fff, 0 0 30px #f0f;
    }
  </style>
</head>
<body>

  <div class="background-waves"></div>

  <div class="container">
    <h1>¡Gracias por Jugar!</h1>
    <p>Esperamos que hayas disfrutado del juego y aprendido sobre el fascinante mundo de las notas musicales.</p>
    <button class="btn" onclick="window.location.href='inicio.html'">Volver al Inicio</button>
  </div>

</body>
</html>
