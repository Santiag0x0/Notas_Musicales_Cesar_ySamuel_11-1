<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pregunta 15 - Notas Musicales</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      font-family: 'Orbitron', sans-serif;
      background: linear-gradient(to right, #0f0c29, #302b63, #24243e);
      color: white;
    }

    .background-waves {
      position: fixed;
      width: 100%;
      height: 100%;
      background: repeating-linear-gradient(
        to bottom,
        rgba(0, 255, 128, 0.2) 0px,
        rgba(0, 255, 128, 0.2) 2px,
        transparent 2px,
        transparent 6px
      );
      animation: moveWaves 2s linear infinite;
      z-index: -1;
    }

    @keyframes moveWaves {
      from { background-position: 0 0; }
      to { background-position: 0 20px; }
    }

    .container {
      max-width: 700px;
      margin: 80px auto;
      padding: 40px 30px;
      background: rgba(0, 0, 0, 0.6);
      border-radius: 12px;
    }

    h1 {
      text-align: center;
      color: #00fff0;
      margin-bottom: 30px;
    }

    .question {
      font-size: 1.3rem;
      margin-bottom: 25px;
    }

    .options label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.1);
      margin: 10px 0;
      padding: 15px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s ease;
      position: relative;
    }

    .options input[type="radio"] {
      display: none;
    }

    .options label.correct {
      background: #1e9c40;
    }

    .options label.incorrect {
      background: #a12323;
    }

    .feedback {
      font-size: 1.5rem;
      margin-left: 10px;
    }

    .next-btn {
      display: block;
      margin: 30px auto 0;
      padding: 12px 30px;
      font-size: 1.1rem;
      border: none;
      background: linear-gradient(45deg, #00fff0, #ff00ff);
      color: black;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      box-shadow: 0 0 12px #00fff0, 0 0 20px #ff00ff;
      display: none;
    }

    .next-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 20px #fff, 0 0 30px #f0f;
    }
  </style>
</head>
<body>

  <div class="background-waves"></div>

  <div class="container">
    <h1>Pregunta 15</h1>
    <div class="question">
      ¿Qué es un Tetracorde?
    </div>
    <form class="options">
      <label data-correct="true">Cuatro notas consecutivas separadas por tonos <span class="feedback"></span>
        <input type="radio" name="q15">
      </label>
      <label data-correct="false">Dos notas consecutivas separadas por tonos  <span class="feedback"></span>
        <input type="radio" name="q15">
      </label>
      <label data-correct="false"> Tres notas consecutivas separadas por tonos  <span class="feedback"></span>
        <input type="radio" name="q15">
      </label>
      <label data-correct="false"> Cinco notas consecutivas separadas por tonos  <span class="feedback"></span>
        <input type="radio" name="q15">
      </label>
    </form>

    <button class="next-btn" onclick="window.location.href='agradecimiento.html'">Finalizar Juego</button>
  </div>

  <script>
    const labels = document.querySelectorAll('.options label');
    let answered = false;

    labels.forEach(label => {
      label.addEventListener('click', () => {
        if (answered) return;
        answered = true;

        const isCorrect = label.dataset.correct === 'true';
        if (isCorrect) {
          label.classList.add('correct');
          label.querySelector('.feedback').textContent = '✔️';
        } else {
          label.classList.add('incorrect');
          label.querySelector('.feedback').textContent = '❌';
        }

        labels.forEach(lab => {
          lab.style.pointerEvents = 'none';
          if (lab.dataset.correct === 'true' && !isCorrect) {
            lab.classList.add('correct');
            lab.querySelector('.feedback').textContent = '✔️';
          }
        });

        document.querySelector('.next-btn').style.display = 'block';
      });
    });
  </script>

</body>
</html>
