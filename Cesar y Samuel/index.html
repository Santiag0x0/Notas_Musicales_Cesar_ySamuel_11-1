<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Portada del Videojuego Musical</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      height: 100%;
      font-family: 'Orbitron', sans-serif;
      background: linear-gradient(to right, #0f0c29, #302b63, #24243e);
      overflow: hidden;
      color: white;
    }

    .background-waves {
      position: absolute;
      width: 100%;
      height: 100%;
      background: repeating-linear-gradient(
        to bottom,
        rgba(0, 255, 128, 0.2) 0px,
        rgba(0, 255, 128, 0.2) 2px,
        transparent 2px,
        transparent 6px
      );
      animation: moveWaves 2s linear infinite;
      z-index: -2;
    }

    @keyframes moveWaves {
      from {
        background-position: 0 0;
      }
      to {
        background-position: 0 20px;
      }
    }

    .container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100%;
      text-align: center;
      padding: 20px;
      z-index: 1;
    }

    h1 {
      font-size: 4rem;
      text-transform: uppercase;
      color: #00fff0;
      letter-spacing: 4px;
    }

    .start-btn {
      margin-top: 40px;
      padding: 15px 40px;
      font-size: 1.2rem;
      border: none;
      background: linear-gradient(45deg, #00fff0, #ff00ff);
      color: black;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      box-shadow: 0 0 15px #00fff0, 0 0 25px #ff00ff;
    }

    .start-btn:hover {
      transform: scale(1.1);
      box-shadow: 0 0 20px #fff, 0 0 40px #f0f;
    }
  </style>
</head>
<body>
  <div class="background-waves"></div>

  <div class="container">
    <h1>Notas espaciales</h1>
    <button class="start-btn" onclick="location.href='temas.html'">Comenzar Juego</button>
  </div>
</body>
</html>
